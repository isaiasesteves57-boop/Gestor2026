                <label className="text-[9px] uppercase tracking-wider text-[#6a7d6a] font-semibold">Time</label>
                <input ref={opTimeInputRef} type="text" value={opForm.time.startsWith("__")?"":opForm.time} list="dl-op-times"
                  onChange={e=>{setOpForm(p=>({...p,time:e.target.value}));setOpNovaTime(e.target.value);}}
                  placeholder="Digite: ex. Real M..."
                  className="w-full font-mono text-xs text-[#e8e0cc] bg-[#0a1410] border border-[#1e3228] rounded px-2 py-1.5 outline-none focus:border-[#c6a15b] mt-1" />
                <datalist id="dl-op-times">
                  {sugestoesLista(times,opForm.time,10).map(t=><option key={t.id} value={t.nome} />)}
                </datalist>
                {opForm.time && !times.some(t=>normBusca(t.nome)===normBusca(opForm.time)) && (
                  <div className="flex items-center justify-between mt-1 px-1">
                    <span className="font-mono text-[8px] text-[#f59e0b]">Time ainda não cadastrado</span>
                    <button type="button" onClick={()=>{const n=opForm.time.trim();if(!n)return;adicionarTime(n);setLastTime(n);}} className="btn-small text-[8px]">+ Cadastrar</button>
                  </div>
                )}
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-[9px] uppercase tracking-wider text-[#6a7d6a] font-semibold">Tipo (opcional)</label>
                  <div className="flex gap-1 mt-1">
                    <button type="button" onClick={()=>{setOpForm(p=>({...p,tipo:p.tipo==="BACK"?"":"BACK"}));setOpCalcTocado(false);}}
                      className="btn-small flex-1 py-1.5" style={opForm.tipo==="BACK"?{borderColor:"#4C8C5C",color:"#4C8C5C"}:{}}>BACK</button>
                    <button type="button" onClick={()=>{setOpForm(p=>({...p,tipo:p.tipo==="LAY"?"":"LAY"}));setOpCalcTocado(false);}}
                      className="btn-small flex-1 py-1.5" style={opForm.tipo==="LAY"?{borderColor:"#e05252",color:"#e05252"}:{}}>LAY</button>
                  </div>
                </div>
                <div>
                  <label className="text-[9px] uppercase tracking-wider text-[#6a7d6a] font-semibold">Odd (opcional)</label>
                  <input type="text" inputMode="decimal" value={opForm.odd} onChange={e=>{setOpForm(p=>({...p,odd:e.target.value}));setOpCalcTocado(false);}}
                    placeholder="1.52"
                    className="w-full font-mono text-xs text-[#e8e0cc] bg-[#0a1410] border border-[#1e3228] rounded px-2 py-1.5 outline-none focus:border-[#c6a15b] mt-1" />
                </div>
              </div>
              <div>
                <label className="text-[9px] uppercase tracking-wider text-[#6a7d6a] font-semibold">Mercado (opcional)</label>
                <input type="text" value={opForm.mercado} onChange={e=>setOpForm(p=>({...p,mercado:e.target.value}))}
                  placeholder="Ex: Resultado da partida — SC Internacional"
                  className="w-full font-mono text-xs text-[#e8e0cc] bg-[#0a1410] border border-[#1e3228] rounded px-2 py-1.5 outline-none focus:border-[#c6a15b] mt-1" />
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-[9px] uppercase tracking-wider text-[#6a7d6a] font-semibold">Entrada (opcional)</label>
                  <div className="flex items-center gap-0.5 mt-1">
                    <span className="font-mono text-[10px] text-[#6a7d6a]">R$</span>
                    <input type="text" inputMode="decimal" value={opForm.entrada} onChange={e=>{setOpForm(p=>({...p,entrada:e.target.value}));setOpCalcTocado(false);}}
                      placeholder="50,00"
                      className="flex-1 font-mono text-xs text-[#e8e0cc] bg-[#0a1410] border border-[#1e3228] rounded px-2 py-1.5 outline-none focus:border-[#c6a15b]" />
                  </div>
                </div>
                {opForm.tipo==="LAY" && (
                  <div>
                    <label className="text-[9px] uppercase tracking-wider text-[#6a7d6a] font-semibold">Responsabilidade</label>
                    <div className="flex items-center gap-0.5 mt-1">
                      <span className="font-mono text-[10px] text-[#6a7d6a]">R$</span>
                      <input type="text" inputMode="decimal" value={opForm.responsabilidade} onChange={e=>{setOpForm(p=>({...p,responsabilidade:e.target.value}));setOpCalcTocado(true);}}
                        placeholder="108,00"
                        className="flex-1 font-mono text-xs text-[#e8e0cc] bg-[#0a1410] border border-[#1e3228] rounded px-2 py-1.5 outline-none focus:border-[#c6a15b]" />
                    </div>
                    <div className="font-mono text-[8px] text-[#6a7d6a] mt-1 px-0.5">Calculada: Entrada × (Odd − 1). Edite se fez saída parcial.</div>
                  </div>
                )}
                {opForm.tipo==="BACK" && (
                  <div>
                    <label className="text-[9px] uppercase tracking-wider text-[#6a7d6a] font-semibold">Lucro possível</label>
                    <div className="flex items-center gap-0.5 mt-1">
                      <span className="font-mono text-[10px] text-[#6a7d6a]">R$</span>
                      <input type="text" inputMode="decimal" value={opForm.lucroPossivel} onChange={e=>{setOpForm(p=>({...p,lucroPossivel:e.target.value}));setOpCalcTocado(true);}}
                        placeholder="26,00"
                        className="flex-1 font-mono text-xs text-[#e8e0cc] bg-[#0a1410] border border-[#1e3228] rounded px-2 py-1.5 outline-none focus:border-[#c6a15b]" />
                    </div>
                    <div className="font-mono text-[8px] text-[#6a7d6a] mt-1 px-0.5">Calculado: Entrada × (Odd − 1). Edite se fez saída parcial.</div>
                  </div>
                )}
              </div>
              <div>
                <label className="text-[9px] uppercase tracking-wider text-[#6a7d6a] font-semibold">Resultado (opcional)</label>
                <div className="flex items-center gap-0.5 mt-1">
                  <span className="font-mono text-[10px] text-[#6a7d6a]">R$</span>
                  <input type="text" inputMode="decimal" value={opForm.resultado} onChange={e=>setOpForm(p=>({...p,resultado:e.target.value}))}
                    onKeyDown={e=>{if(e.key==="Enter")salvarOp();if(e.key==="Escape")setShowAddOp(false);}}
                    className="flex-1 font-mono text-xs text-[#e8e0cc] bg-[#0a1410] border border-[#1e3228] rounded px-2 py-1.5 outline-none focus:border-[#c6a15b]"
                    placeholder="+50,00 ou -20,00" />
                </div>
                <div className="font-mono text-[8px] text-[#6a7d6a] mt-1 px-0.5">🟡 Deixe em branco para salvar como "Aberta" e informar o resultado depois.</div>
              </div>
              <div>
                <label className="text-[9px] uppercase tracking-wider text-[#6a7d6a] font-semibold">Horário (opcional)</label>
                <input type="time" value={opForm.hora} onChange={e=>setOpForm(p=>({...p,hora:e.target.value}))}
                  className="w-full font-mono text-xs text-[#e8e0cc] bg-[#0a1410] border border-[#1e3228] rounded px-2 py-1.5 outline-none focus:border-[#c6a15b] mt-1" />
              </div>
              <div>
                <label className="text-[9px] uppercase tracking-wider text-[#6a7d6a] font-semibold">Observação (opcional)</label>
                <input type="text" value={opForm.observacao} onChange={e=>setOpForm(p=>({...p,observacao:e.target.value}))}
                  onKeyDown={e=>{if(e.key==="Enter")salvarOp();}}
                  className="w-full font-mono text-xs text-[#e8e0cc] bg-[#0a1410] border border-[#1e3228] rounded px-2 py-1.5 outline-none focus:border-[#c6a15b] mt-1"
                  placeholder="Anotação rápida..." />
              </div>
            </div>
            <div className="flex gap-2 mt-4">
              <button onClick={()=>setShowAddOp(false)} className="btn-secondary flex-1 py-2">Cancelar</button>
              <button onClick={salvarOp} className="btn-primary py-2" style={{flex:1.5}}>
                {opEditIdx!=null?"Salvar":"Adicionar"}
              </button>
            </div>
          </div>
        </div>
      )}

      {showFinalizarOp && (
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100}}>
          <div className="card" style={{maxWidth:320,width:"92%",padding:16}}>
            <div className="text-center mb-3">
              <span style={{fontSize:20}}>🏁</span>
              <div className="font-mono text-sm text-[#e8e0cc] mt-1 font-bold">Finalizar Operação</div>
              <div className="font-mono text-[9px] text-[#6a7d6a] mt-1">Informe o resultado real desta operação</div>
            </div>
            <div className="space-y-3">
              <div>
                <label className="text-[9px] uppercase tracking-wider text-[#6a7d6a] font-semibold">Resultado</label>
                <div className="grid grid-cols-2 gap-1.5 mt-1">
                  <button type="button" onClick={()=>{setFinalizarTipo("green_total");setFinalizarErro("");}}
                    className="btn-small py-2 text-[10px]" style={finalizarTipo==="green_total"?{borderColor:"#4C8C5C",color:"#4C8C5C",background:"rgba(76,140,92,0.1)"}:{}}>🟢 Green Total</button>
                  <button type="button" onClick={()=>{setFinalizarTipo("green_parcial");setFinalizarErro("");}}
                    className="btn-small py-2 text-[10px]" style={finalizarTipo==="green_parcial"?{borderColor:"#4C8C5C",color:"#4C8C5C",background:"rgba(76,140,92,0.1)"}:{}}>🟢 Green Parcial</button>
                  <button type="button" onClick={()=>{setFinalizarTipo("red_parcial");setFinalizarErro("");}}
                    className="btn-small py-2 text-[10px]" style={finalizarTipo==="red_parcial"?{borderColor:"#A6432D",color:"#A6432D",background:"rgba(166,67,45,0.1)"}:{}}>🔴 Red Parcial</button>
                  <button type="button" onClick={()=>{setFinalizarTipo("red_total");setFinalizarErro("");}}
                    className="btn-small py-2 text-[10px]" style={finalizarTipo==="red_total"?{borderColor:"#A6432D",color:"#A6432D",background:"rgba(166,67,45,0.1)"}:{}}>🔴 Red Total</button>
                </div>
              </div>
              <div>
                <label className="text-[9px] uppercase tracking-wider text-[#6a7d6a] font-semibold">Valor real obtido</label>
                <div className="flex items-center gap-0.5 mt-1">
                  <span className="font-mono text-[10px] text-[#6a7d6a]">R$</span>
                  <input type="text" inputMode="decimal" value={finalizarValor} onChange={e=>{setFinalizarValor(e.target.value);setFinalizarErro("");}}
                    onKeyDown={e=>{if(e.key==="Enter")confirmarFinalizarOp();if(e.key==="Escape")setShowFinalizarOp(false);}}
                    className="flex-1 font-mono text-xs text-[#e8e0cc] bg-[#0a1410] border border-[#1e3228] rounded px-2 py-1.5 outline-none focus:border-[#c6a15b]"
                    placeholder="Ex: 18,00" autoFocus />
                </div>
                <div className="font-mono text-[8px] text-[#6a7d6a] mt-1 px-0.5">Digite sempre um valor positivo — o sinal é definido pela opção escolhida acima.</div>
                {finalizarErro && <div className="font-mono text-[8px] text-[#e05252] mt-1 px-0.5">{finalizarErro}</div>}
              </div>
            </div>
            <div className="flex gap-2 mt-4">
              <button onClick={()=>setShowFinalizarOp(false)} className="btn-secondary flex-1 py-2">Cancelar</button>
              <button onClick={()=>{ if(!finalizarTipo){setFinalizarErro("Escolha uma opção de resultado.");return;} confirmarFinalizarOp(); }} className="btn-primary py-2" style={{flex:1.5}}>Confirmar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

class ErroLimite extends React.Component {
  constructor(props) { super(props); this.state = { erro: null }; }
  static getDerivedStateFromError(erro) { return { erro }; }
  componentDidCatch(erro, info) { console.error(erro, info); }
  render() {
    if (this.state.erro) {
      return (
        <div className="bg-app" style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:20,textAlign:"center"}}>
          <span style={{fontSize:28}}>⚠️</span>
          <h2 style={{color:"#c6a15b",fontFamily:"'Inter',sans-serif"}}>Algo deu errado</h2>
          <p className="font-mono text-xs text-[#6a7d6a]" style={{maxWidth:280}}>{this.state.erro.message}</p>
          <p className="font-mono text-[10px] text-[#4a5a4a]">Seus dados estão salvos, pode recarregar sem perder nada.</p>
          <button onClick={()=>window.location.reload()} className="btn-primary" style={{marginTop:14,maxWidth:200}}>Recarregar</button>
        </div>
      );
    }
    return this.props.children;
  }
}

try { ReactDOM.createRoot(document.getElementById("root")).render(<ErroLimite><App /></ErroLimite>); }
catch(e) { console.error("RENDER ERROR:", e); document.getElementById("root").innerHTML=`<div style="color:#e8e0cc;padding:20px;font-family:monospace;font-size:12px;"><h2 style="color:#c6a15b;">Erro</h2><p>${e.message}</p></div>`; }
</script>

<script>
  if('serviceWorker' in navigator) {
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('service-worker.js?v=9.9.0').then(reg=>{
        reg.addEventListener('updatefound', ()=>{
          const novo = reg.installing;
          if(!novo) return;
          novo.addEventListener('statechange', ()=>{
            if(novo.state==='installed' && navigator.serviceWorker.controller) {
              novo.postMessage('skipWaiting');
              window.location.reload();
            }
          });
        });
      }).catch(()=>{});
    });
  }
</script>
</body>
</html>
